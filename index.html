<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#6366f1"
    >

    <meta
        name="description"
        content="Reto del Minuto - Juego educativo interactivo"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <title>Reto del Minuto</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }


        body {

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed,
                    #9333ea
                );

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            transition: 0.3s;
        }


        .app {

            width: 100%;

            max-width: 520px;

            background: white;

            border-radius: 28px;

            padding: 30px;

            box-shadow:
                0 25px 60px
                rgba(0,0,0,0.25);

            position: relative;

            overflow: hidden;
        }


        .dark-mode {

            position: absolute;

            top: 18px;

            right: 18px;

            width: 42px;

            height: 42px;

            border-radius: 50%;

            border: none;

            background: #f3f4f6;

            cursor: pointer;

            font-size: 18px;
        }


        .screen {
            display: none;
        }


        .screen.active {
            display: block;
        }


        .logo {

            text-align: center;

            font-size: 70px;

            margin-bottom: 10px;

            animation:
                floating 2s infinite;
        }


        @keyframes floating {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }


        h1 {

            text-align: center;

            color: #111827;

            font-size: 34px;

            margin-bottom: 8px;
        }


        .subtitle {

            text-align: center;

            color: #6b7280;

            margin-bottom: 30px;
        }


        .categories {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 12px;

            margin-bottom: 25px;
        }


        .category {

            padding: 20px;

            border: 2px solid #e5e7eb;

            border-radius: 18px;

            background: white;

            cursor: pointer;

            transition: 0.2s;

            text-align: center;

            font-size: 16px;

            font-weight: bold;
        }


        .category:hover {

            border-color: #6366f1;

            transform:
                translateY(-3px);

            background: #eef2ff;
        }


        .category.selected {

            border-color: #6366f1;

            background: #eef2ff;

            color: #4338ca;
        }


        .category span {

            display: block;

            font-size: 30px;

            margin-bottom: 8px;
        }


        .btn {

            width: 100%;

            border: none;

            border-radius: 16px;

            padding: 16px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        .btn-primary {

            background: #6366f1;

            color: white;
        }


        .btn-primary:hover {

            background: #4f46e5;

            transform:
                translateY(-2px);
        }


        .btn-secondary {

            background: #111827;

            color: white;

            margin-top: 10px;
        }


        .game-header {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 20px;
        }


        .stat-box {

            background: #f3f4f6;

            padding: 10px 14px;

            border-radius: 14px;

            text-align: center;
        }


        .stat-box small {

            display: block;

            color: #6b7280;

            font-size: 11px;
        }


        .stat-box strong {

            color: #4f46e5;

            font-size: 18px;
        }


        .lives {

            text-align: center;

            font-size: 25px;

            margin-bottom: 15px;
        }


        .combo {

            text-align: center;

            color: #f97316;

            font-weight: bold;

            height: 25px;

            margin-bottom: 5px;
        }


        .timer {

            width: 120px;

            height: 120px;

            border-radius: 50%;

            border: 8px solid #6366f1;

            background: #eef2ff;

            display: flex;

            align-items: center;

            justify-content: center;

            margin:
                0 auto 25px;

            transition: 0.3s;
        }


        .timer span {

            font-size: 38px;

            font-weight: bold;

            color: #4f46e5;
        }


        .timer.warning {

            border-color: #ef4444;

            background: #fef2f2;

            animation:
                pulse 0.8s infinite;
        }


        .timer.warning span {

            color: #ef4444;
        }


        @keyframes pulse {

            50% {
                transform: scale(1.06);
            }
        }


        .question-card {

            background: #f9fafb;

            padding: 25px;

            border-radius: 20px;

            margin-bottom: 18px;

            text-align: center;
        }


        .question-number {

            color: #6366f1;

            font-size: 13px;

            font-weight: bold;

            margin-bottom: 10px;
        }


        .question {

            color: #111827;

            font-size: 21px;

            line-height: 1.4;
        }


        .options {

            display: grid;

            gap: 10px;

            margin-bottom: 15px;
        }


        .option {

            padding: 15px;

            border-radius: 15px;

            border: 2px solid #e5e7eb;

            background: white;

            cursor: pointer;

            font-size: 16px;

            text-align: left;

            transition: 0.2s;
        }


        .option:hover {

            border-color: #6366f1;

            background: #eef2ff;
        }


        .option.correct {

            background: #dcfce7;

            border-color: #22c55e;

            color: #166534;
        }


        .option.wrong {

            background: #fee2e2;

            border-color: #ef4444;

            color: #991b1b;
        }


        .option.disabled {

            pointer-events: none;
        }


        .hint {

            text-align: center;

            color: #d97706;

            background: #fef3c7;

            padding: 12px;

            border-radius: 12px;

            margin-bottom: 15px;

            display: none;

            font-size: 14px;
        }


        .hint.show {
            display: block;
        }


        .feedback {

            text-align: center;

            font-size: 18px;

            font-weight: bold;

            min-height: 28px;

            margin-bottom: 10px;
        }


        .final-icon {

            text-align: center;

            font-size: 70px;

            margin-bottom: 10px;
        }


        .final-score {

            text-align: center;

            font-size: 55px;

            font-weight: bold;

            color: #6366f1;

            margin: 10px 0;
        }


        .final-text {

            text-align: center;

            color: #6b7280;

            margin-bottom: 25px;
        }


        .results {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;

            margin-bottom: 20px;
        }


        .result-card {

            background: #f3f4f6;

            border-radius: 15px;

            padding: 15px;

            text-align: center;
        }


        .result-card strong {

            display: block;

            color: #4f46e5;

            font-size: 22px;

            margin-bottom: 4px;
        }


        .result-card span {

            color: #6b7280;

            font-size: 12px;
        }


        .correct-animation {

            animation:
                correct 0.4s;
        }


        @keyframes correct {

            50% {
                transform: scale(1.03);
            }
        }


        body.dark {

            background:
                linear-gradient(
                    135deg,
                    #111827,
                    #312e81
                );
        }


        body.dark .app {
            background: #1f2937;
        }


        body.dark h1,
        body.dark .question {
            color: white;
        }


        body.dark .subtitle {
            color: #9ca3af;
        }


        body.dark .category {

            background: #374151;

            border-color: #4b5563;

            color: white;
        }


        body.dark .category:hover,
        body.dark .category.selected {

            background: #312e81;

            border-color: #818cf8;
        }


        body.dark .stat-box {
            background: #374151;
        }


        body.dark .question-card {
            background: #374151;
        }


        body.dark .option {

            background: #374151;

            border-color: #4b5563;

            color: white;
        }


        body.dark .option:hover {
            background: #312e81;
        }


        body.dark .dark-mode {

            background: #374151;

            color: white;
        }


        @media (max-width: 500px) {

            .app {
                padding: 20px;
            }


            h1 {
                font-size: 28px;
            }


            .timer {

                width: 105px;

                height: 105px;
            }


            .timer span {
                font-size: 32px;
            }

        }

    </style>

</head>


<body>


<div class="app">


    <button
        class="dark-mode"
        id="darkMode">

        🌙

    </button>


    <!-- INICIO -->

    <section
        id="homeScreen"
        class="screen active">


        <div class="logo">
            🎯
        </div>


        <h1>
            Reto del Minuto
        </h1>


        <p class="subtitle">

            ¿Puedes superar el desafío
            antes de que se acabe el tiempo?

        </p>


        <h3
            style="margin-bottom:15px;">

            Elige una categoría

        </h3>


        <div class="categories">


            <button
                class="category"
                data-category="tecnologia">

                <span>💻</span>

                Tecnología

            </button>


            <button
                class="category"
                data-category="universidad">

                <span>🎓</span>

                Universidad

            </button>


            <button
                class="category"
                data-category="cultura">

                <span>🌎</span>

                Cultura

            </button>


            <button
                class="category"
                data-category="innovacion">

                <span>💡</span>

                Innovación

            </button>


        </div>


        <button
            id="startGame"
            class="btn btn-primary">

            🚀 Comenzar

        </button>


    </section>


    <!-- JUEGO -->

    <section
        id="gameScreen"
        class="screen">


        <div class="game-header">


            <div class="stat-box">

                <small>PUNTOS</small>

                <strong id="score">
                    0
                </strong>

            </div>


            <div class="stat-box">

                <small>RETO</small>

                <strong id="round">
                    1
                </strong>

            </div>


            <div class="stat-box">

                <small>RÉCORD</small>

                <strong id="best">
                    0
                </strong>

            </div>


        </div>


        <div
            id="lives"
            class="lives">

            ❤️ ❤️ ❤️

        </div>


        <div
            id="combo"
            class="combo">
        </div>


        <div
            id="timerCircle"
            class="timer">

            <span id="timer">
                60
            </span>

        </div>


        <div
            id="questionCard"
            class="question-card">


            <div
                id="questionNumber"
                class="question-number">

                RETO #1

            </div>


            <div
                id="question"
                class="question">

                Pregunta

            </div>


        </div>


        <div
            id="options"
            class="options">
        </div>


        <div
            id="hint"
            class="hint">
        </div>


        <div
            id="feedback"
            class="feedback">
        </div>


        <button
            id="hintButton"
            class="btn btn-secondary">

            💡 Usar pista

        </button>


        <button
            id="nextButton"
            class="btn btn-primary"
            style="
                display:none;
                margin-top:10px;
            ">

            ➡️ Siguiente reto

        </button>


    </section>


    <!-- RESULTADO -->

    <section
        id="resultScreen"
        class="screen">


        <div class="final-icon">
            🏆
        </div>


        <h1>
            ¡Partida terminada!
        </h1>


        <div
            id="finalScore"
            class="final-score">

            0

        </div>


        <p class="final-text">
            puntos conseguidos
        </p>


        <div class="results">


            <div class="result-card">

                <strong id="correctAnswers">
                    0
                </strong>

                <span>
                    Correctas
                </span>

            </div>


            <div class="result-card">

                <strong id="wrongAnswers">
                    0
                </strong>

                <span>
                    Incorrectas
                </span>

            </div>


            <div class="result-card">

                <strong id="bestCombo">
                    0
                </strong>

                <span>
                    Mejor combo
                </span>

            </div>


            <div class="result-card">

                <strong id="totalRounds">
                    0
                </strong>

                <span>
                    Retos
                </span>

            </div>


        </div>


        <button
            id="playAgain"
            class="btn btn-primary">

            🔄 Jugar otra vez

        </button>


    </section>


</div>


<script src="app.js"></script>


</body>
</html>
